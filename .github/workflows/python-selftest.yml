name: Python baseline checks

on:
  push:
    branches:
      - main
      - "update/**"
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile
        run: python -m py_compile fs_25_crop_porter_v_0_3.py

      - name: Run CropPorter selftest
        run: python fs_25_crop_porter_v_0_3.py selftest
